name: Cupboard Regression

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm run test:regression

      - name: Firestore rules tests
        working-directory: .
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-cupboard-rules "cd app && npm run test:rules"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
